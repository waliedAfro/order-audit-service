

server.port=9095
ORDER_CREATED_TOPIC = "order.created";

spring.datasource.url: ${DB_URL}
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name: org.postgresql.Driver

spring.jpa.hibernate.ddl-auto: update
spring.jpa.show-sql: false
spring.jpa.open-in-view: false

spring.properties.hibernate.format_sql: true
spring.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode: never

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO
spring.kafka.admin.operation-timeout=30s
spring.kafka.admin.close-timeout=10s